# Headless test — no TUI, just reason + timer
workers:
  - type: reason
    id: test-reasoner
    instruction: "You are a test worker running in headless mode."
    subscriptions:
      - worker.discover
      - tool.completed
      - tool.failed
      - tool.rejected
      - worker.ready
      - worker.gone
      - worker.abort
      - timer.timeout
      - timer.reminder
      - worker.input
      - tool.requested
      - decision.made
    provider: openai
    model: gpt-4o

  - type: timer
    id: test-timer
